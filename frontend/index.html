<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Tracker</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1b1f26;
    --panel-raised: #232833;
    --border: #2c313b;
    --text: #e7e9ec;
    --text-dim: #98a1ad;
    --text-faint: #666f7c;
    --accent: #2dd4bf;
    --accent-dim: #1a3b38;
    --danger: #ef6461;
    --danger-dim: #3a2422;
    --priority-high: #ef6461;
    --priority-medium: #f0a85a;
    --priority-low: #6b7684;
    --status-todo: #6b7684;
    --status-inprogress: #2dd4bf;
    --status-done: #4ade80;
    --radius: 10px;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }

  header .title-block h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header .title-block p {
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 13px;
  }

  .status-pill {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .status-pill.connected { border-color: var(--status-inprogress); color: var(--status-inprogress); }
  .status-pill.error { border-color: var(--danger); color: var(--danger); }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--accent);
    color: #0b1a18;
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 8px;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.97); }

  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-faint); }

  main {
    padding: 24px 32px 48px;
  }

  #board-error {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--danger-dim);
    border: 1px solid var(--danger);
    color: #ffd7d5;
    padding: 14px 18px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    font-size: 14px;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(260px, 1fr));
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr; }
  }

  .column {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 200px;
    display: flex;
    flex-direction: column;
  }

  .column.drag-over {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .column-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.ToDo { background: var(--status-todo); }
  .status-dot.InProgress { background: var(--status-inprogress); box-shadow: 0 0 8px var(--status-inprogress); }
  .status-dot.Done { background: var(--status-done); }

  .column-header h2 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    flex: 1;
  }

  .column-count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-faint);
    background: var(--panel-raised);
    padding: 2px 8px;
    border-radius: 999px;
  }

  .card-list {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 60px;
  }

  .card {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: grab;
    transition: border-color 0.12s ease, opacity 0.12s ease;
  }
  .card:hover { border-color: var(--text-faint); }
  .card.dragging { opacity: 0.4; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.35;
  }

  .priority-chip {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 999px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .priority-chip.High { background: rgba(239,100,97,0.15); color: var(--priority-high); }
  .priority-chip.Medium { background: rgba(240,168,90,0.15); color: var(--priority-medium); }
  .priority-chip.Low { background: rgba(107,118,132,0.2); color: var(--priority-low); }

  .card-desc {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 6px;
    line-height: 1.4;
  }

  .card-meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 8px;
  }

  .tag-chip {
    font-size: 10.5px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 999px;
  }

  .due-date-chip {
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }

  .due-date-chip.overdue {
    background: rgba(239,100,97,0.15);
    color: var(--priority-high);
    border-color: var(--priority-high);
    font-weight: 600;
  }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .filter-bar input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 11px;
    font-size: 13px;
    width: 160px;
  }
  .filter-bar input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .filter-checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
  }

  .card-assignee {
    font-size: 11.5px;
    color: var(--text-faint);
  }

  .card-edit-btn {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 11.5px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .card-edit-btn:hover { color: var(--accent); background: var(--panel); }

  .empty-placeholder {
    color: var(--text-faint);
    font-size: 12.5px;
    text-align: center;
    padding: 24px 8px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    margin: 4px 0;
  }

  .loading-placeholder {
    color: var(--text-faint);
    font-size: 12.5px;
    text-align: center;
    padding: 24px 8px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(6, 8, 11, 0.65);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 440px;
    padding: 24px;
    max-height: 88vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .modal-header h2 { margin: 0; font-size: 17px; }

  .modal-close {
    background: none;
    border: none;
    color: var(--text-faint);
    font-size: 20px;
    line-height: 1;
    padding: 4px;
  }
  .modal-close:hover { color: var(--text); }

  .field {
    margin-bottom: 14px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .field input,
  .field textarea,
  .field select {
    width: 100%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 9px 11px;
    font-size: 13.5px;
    font-family: inherit;
  }

  .field input:focus,
  .field textarea:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
  }

  .field textarea { resize: vertical; min-height: 60px; }

  .field-error {
    color: var(--danger);
    font-size: 12px;
    margin-top: 5px;
    display: none;
  }
  .field-error.show { display: block; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .server-error-banner {
    display: none;
    background: var(--danger-dim);
    border: 1px solid var(--danger);
    color: #ffd7d5;
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 7px;
    margin-bottom: 14px;
  }
  .server-error-banner.show { display: block; }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 18px;
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <h1>Task Tracker</h1>
    <p>Kanban board &middot; synced with the FastAPI backend</p>
  </div>
  <div style="display:flex; align-items:center; gap:12px;">
    <span id="connection-pill" class="status-pill">connecting&hellip;</span>
    <button class="btn-primary" id="new-task-btn">+ New Task</button>
  </div>
</header>

<main>
  <div id="board-error">
    <span id="board-error-text">Could not reach the backend.</span>
    <button class="btn-secondary" id="retry-btn">Retry</button>
  </div>

  <div class="filter-bar">
    <label class="filter-checkbox">
      <input type="checkbox" id="filter-overdue" />
      Overdue only
    </label>
    <input type="text" id="filter-tag" placeholder="Filter by tag&hellip;" />
    <button class="btn-secondary" id="clear-filters-btn">Clear filters</button>
  </div>

  <div class="board" id="board">
    <!-- columns injected by renderBoard() -->
  </div>
</main>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title">New Task</h2>
      <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
    </div>

    <div class="server-error-banner" id="server-error-banner"></div>

    <form id="task-form">
      <input type="hidden" id="field-task-id" />

      <div class="field">
        <label for="field-title">Title</label>
        <input type="text" id="field-title" maxlength="200" />
        <div class="field-error" id="error-title">Title is required.</div>
      </div>

      <div class="field">
        <label for="field-description">Description</label>
        <textarea id="field-description"></textarea>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="field-status">Status</label>
          <select id="field-status">
            <option value="ToDo">To Do</option>
            <option value="InProgress">In Progress</option>
            <option value="Done">Done</option>
          </select>
        </div>
        <div class="field">
          <label for="field-priority">Priority</label>
          <select id="field-priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="field-assignee">Assignee</label>
          <input type="text" id="field-assignee" placeholder="Unassigned" />
        </div>
        <div class="field">
          <label for="field-due-date">Due date</label>
          <input type="date" id="field-due-date" />
        </div>
      </div>

      <div class="field">
        <label for="field-tags">Tags (comma-separated)</label>
        <input type="text" id="field-tags" placeholder="backend, urgent" />
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn-primary" id="save-btn">Save Task</button>
      </div>
    </form>
  </div>
</div>

<script>
  // ---------------------------------------------------------------------
  // Constants
  // ---------------------------------------------------------------------
  const API_BASE = "http://localhost:8000";
  const STATUSES = ["ToDo", "InProgress", "Done"];
  const STATUS_LABELS = { ToDo: "To Do", InProgress: "In Progress", Done: "Done" };
  const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  let tasks = [];
  let boardState = "loading"; // loading | ready | empty | error
  let modalMode = "create"; // create | edit
  let originalTaskStatus = null; // status the task had when the modal opened (edit mode only)
  let draggedTaskId = null;

  const boardEl = document.getElementById("board");
  const boardErrorEl = document.getElementById("board-error");
  const boardErrorTextEl = document.getElementById("board-error-text");
  const connectionPillEl = document.getElementById("connection-pill");

  // ---------------------------------------------------------------------
  // Fetch + render
  // ---------------------------------------------------------------------
  function buildTaskQuery() {
    const params = new URLSearchParams();
    if (document.getElementById("filter-overdue").checked) {
      params.set("overdue", "true");
    }
    const tagValue = document.getElementById("filter-tag").value.trim();
    if (tagValue) {
      params.set("tag", tagValue);
    }
    const query = params.toString();
    return query ? `?${query}` : "";
  }

  async function fetchTasks() {
    boardState = "loading";
    renderBoard();
    boardErrorEl.style.display = "none";

    try {
      const res = await fetch(`${API_BASE}/tasks${buildTaskQuery()}`);
      if (!res.ok) throw new Error(`Server responded ${res.status}`);
      tasks = await res.json();
      boardState = tasks.length === 0 ? "empty" : "ready";
      connectionPillEl.textContent = "connected";
      connectionPillEl.className = "status-pill connected";
    } catch (err) {
      boardState = "error";
      boardErrorTextEl.textContent =
        "Could not reach the backend at " + API_BASE + ". Is the server running?";
      boardErrorEl.style.display = "flex";
      connectionPillEl.textContent = "offline";
      connectionPillEl.className = "status-pill error";
    }
    renderBoard();
  }

  function sortTasks(list) {
    return [...list].sort((a, b) => {
      const p = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
      if (p !== 0) return p;
      return a.id < b.id ? -1 : 1;
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  function renderBoard() {
    boardEl.innerHTML = "";

    STATUSES.forEach((status) => {
      const column = document.createElement("div");
      column.className = "column";
      column.dataset.status = status;

      const columnTasks =
        boardState === "ready" || boardState === "empty"
          ? sortTasks(tasks.filter((t) => t.status === status))
          : [];

      column.innerHTML = `
        <div class="column-header">
          <span class="status-dot ${status}"></span>
          <h2>${STATUS_LABELS[status]}</h2>
          <span class="column-count">${
            boardState === "ready" || boardState === "empty" ? columnTasks.length : "-"
          }</span>
        </div>
        <div class="card-list" data-status="${status}"></div>
      `;

      const listEl = column.querySelector(".card-list");

      if (boardState === "loading") {
        listEl.innerHTML = `<div class="loading-placeholder">Loading tasks&hellip;</div>`;
      } else if (boardState === "error") {
        listEl.innerHTML = `<div class="empty-placeholder">Unavailable</div>`;
      } else if (columnTasks.length === 0) {
        listEl.innerHTML = `<div class="empty-placeholder">No tasks</div>`;
      } else {
        columnTasks.forEach((task) => listEl.appendChild(renderCard(task)));
      }

      attachDropHandlers(listEl, column);
      boardEl.appendChild(column);
    });
  }

  function renderMetaChips(task) {
    const dueDateChip = task.due_date
      ? `<span class="due-date-chip${task.is_overdue ? " overdue" : ""}">${
          task.is_overdue ? "Overdue: " : "Due "
        }${escapeHtml(task.due_date)}</span>`
      : "";
    const tagChips = (task.tags || [])
      .map((t) => `<span class="tag-chip">${escapeHtml(t)}</span>`)
      .join("");
    return dueDateChip + tagChips;
  }

  function renderCard(task) {
    const card = document.createElement("div");
    card.className = "card";
    card.draggable = true;
    card.dataset.taskId = task.id;

    card.innerHTML = `
      <div class="card-top">
        <div class="card-title">${escapeHtml(task.title)}</div>
        <span class="priority-chip ${task.priority}">${task.priority}</span>
      </div>
      ${task.description ? `<div class="card-desc">${escapeHtml(task.description)}</div>` : ""}
      <div class="card-meta-row">${renderMetaChips(task)}</div>
      <div class="card-footer">
        <span class="card-assignee">${task.assignee ? escapeHtml(task.assignee) : "Unassigned"}</span>
        <button class="card-edit-btn" data-edit-id="${task.id}">Edit</button>
      </div>
    `;

    card.addEventListener("dragstart", () => {
      draggedTaskId = task.id;
      card.classList.add("dragging");
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      draggedTaskId = null;
    });

    card.querySelector("[data-edit-id]").addEventListener("click", () => {
      openModal("edit", task);
    });

    return card;
  }

  // ---------------------------------------------------------------------
  // Drag and drop
  // ---------------------------------------------------------------------
  function attachDropHandlers(listEl, columnEl) {
    listEl.addEventListener("dragover", (e) => {
      e.preventDefault();
      columnEl.classList.add("drag-over");
    });
    listEl.addEventListener("dragleave", () => {
      columnEl.classList.remove("drag-over");
    });
    listEl.addEventListener("drop", async (e) => {
      e.preventDefault();
      columnEl.classList.remove("drag-over");
      const newStatus = listEl.dataset.status;
      if (!draggedTaskId) return;

      const task = tasks.find((t) => t.id === draggedTaskId);
      if (!task || task.status === newStatus) return; // same-column drop: no-op

      const previousStatus = task.status;
      task.status = newStatus; // optimistic update
      renderBoard();

      try {
        const res = await fetch(`${API_BASE}/tasks/${task.id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: newStatus }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || `Server responded ${res.status}`);
        }
        const updated = await res.json();
        const idx = tasks.findIndex((t) => t.id === updated.id);
        tasks[idx] = updated;
      } catch (err) {
        task.status = previousStatus; // revert
        boardErrorTextEl.textContent = "Move rejected: " + err.message;
        boardErrorEl.style.display = "flex";
      }
      renderBoard();
    });
  }

  document.getElementById("retry-btn").addEventListener("click", fetchTasks);

  document.getElementById("filter-overdue").addEventListener("change", fetchTasks);
  let tagFilterDebounce;
  document.getElementById("filter-tag").addEventListener("input", () => {
    clearTimeout(tagFilterDebounce);
    tagFilterDebounce = setTimeout(fetchTasks, 300);
  });
  document.getElementById("clear-filters-btn").addEventListener("click", () => {
    document.getElementById("filter-overdue").checked = false;
    document.getElementById("filter-tag").value = "";
    fetchTasks();
  });

  // ---------------------------------------------------------------------
  // Modal: create / edit
  // ---------------------------------------------------------------------
  const overlayEl = document.getElementById("modal-overlay");
  const formEl = document.getElementById("task-form");
  const modalTitleEl = document.getElementById("modal-title");
  const serverErrorBanner = document.getElementById("server-error-banner");
  const titleInput = document.getElementById("field-title");
  const titleError = document.getElementById("error-title");

  function openModal(mode, task) {
    modalMode = mode;
    clearFormErrors();

    if (mode === "create") {
      modalTitleEl.textContent = "New Task";
      originalTaskStatus = null;
      document.getElementById("field-task-id").value = "";
      titleInput.value = "";
      document.getElementById("field-description").value = "";
      document.getElementById("field-status").value = "ToDo";
      document.getElementById("field-priority").value = "Medium";
      document.getElementById("field-assignee").value = "";
      document.getElementById("field-due-date").value = "";
      document.getElementById("field-tags").value = "";
    } else {
      modalTitleEl.textContent = "Edit Task";
      originalTaskStatus = task.status;
      document.getElementById("field-task-id").value = task.id;
      titleInput.value = task.title;
      document.getElementById("field-description").value = task.description || "";
      document.getElementById("field-status").value = task.status;
      document.getElementById("field-priority").value = task.priority;
      document.getElementById("field-assignee").value = task.assignee || "";
      document.getElementById("field-due-date").value = task.due_date || "";
      document.getElementById("field-tags").value = (task.tags || []).join(", ");
    }

    overlayEl.classList.add("open");
    titleInput.focus();
  }

  function closeModal() {
    overlayEl.classList.remove("open");
    clearFormErrors();
  }

  function clearFormErrors() {
    titleError.classList.remove("show");
    serverErrorBanner.classList.remove("show");
    serverErrorBanner.textContent = "";
  }

  document.getElementById("new-task-btn").addEventListener("click", () => openModal("create"));
  document.getElementById("cancel-btn").addEventListener("click", closeModal);
  document.getElementById("modal-close-btn").addEventListener("click", closeModal);
  overlayEl.addEventListener("click", (e) => {
    if (e.target === overlayEl) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && overlayEl.classList.contains("open")) closeModal();
  });

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearFormErrors();

    const trimmedTitle = titleInput.value.trim();
    if (!trimmedTitle) {
      titleError.classList.add("show");
      return; // do not send a request for an empty/whitespace title
    }

    const dueDateValue = document.getElementById("field-due-date").value;
    const tagsValue = document
      .getElementById("field-tags")
      .value.split(",")
      .map((t) => t.trim())
      .filter((t) => t.length > 0);

    const statusValue = document.getElementById("field-status").value;
    const taskId = document.getElementById("field-task-id").value;
    const isEdit = Boolean(taskId);

    const payload = {
      title: trimmedTitle,
      description: document.getElementById("field-description").value,
      priority: document.getElementById("field-priority").value,
      assignee: document.getElementById("field-assignee").value.trim() || null,
      due_date: dueDateValue || null,
      tags: tagsValue,
    };

    // Only send `status` when it's a new task, or when editing AND the status
    // was actually changed. The backend rejects a same-status PATCH as a
    // no-op transition (422), so re-sending the unchanged status on every
    // edit would incorrectly fail saves that don't touch status at all.
    if (!isEdit || statusValue !== originalTaskStatus) {
      payload.status = statusValue;
    }

    try {
      const res = await fetch(
        isEdit ? `${API_BASE}/tasks/${taskId}` : `${API_BASE}/tasks`,
        {
          method: isEdit ? "PATCH" : "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        }
      );

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        const detail = Array.isArray(body.detail)
          ? body.detail.map((d) => d.msg).join("; ")
          : body.detail || `Server responded ${res.status}`;
        serverErrorBanner.textContent = detail;
        serverErrorBanner.classList.add("show");
        return; // keep modal open on 422
      }

      closeModal();
      await fetchTasks();
    } catch (err) {
      serverErrorBanner.textContent = "Network error: " + err.message;
      serverErrorBanner.classList.add("show");
    }
  });

  // ---------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------
  fetchTasks();
</script>

</body>
</html>
