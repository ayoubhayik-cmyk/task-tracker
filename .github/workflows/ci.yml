name: CI

on:
  push:
    branches: [main, mid-course-project, final-project]
  pull_request:
    branches: [main, mid-course-project, final-project]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model verification (verify_a)
        run: python -m tests.verify_a

      - name: Run pytest suite
        run: pytest tests/ -v

      - name: Verify the app starts and /health responds
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 3
          curl --fail http://127.0.0.1:8000/health
